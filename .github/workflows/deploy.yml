name: CI and Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deploys at once; queue instead of cancelling so a push
# mid-deploy still lands.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Kept separate from the Pages jobs on purpose. actions/configure-pages fails
  # until Pages is enabled with "GitHub Actions" as its source, and when that
  # step lived alongside the tests it turned the whole job red and hid a
  # perfectly good test run.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # The data-stage pipeline is stdlib-only, so this needs no install step.
      - run: python -m unittest discover -s pipeline -t .
      - run: npm run build

  build-pages:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # Requires Settings -> Pages -> Source = "GitHub Actions".
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build-pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
